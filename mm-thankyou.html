<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Global Coach IT Academy</title>
    <meta name="description"
        content="Thank you for contacting Global Coach IT Academy. Our team will call you shortly.">
    <link rel="icon" href="favicon.jpg">
    <style>
        :root {
            color-scheme: light;
            --accent: #0284c7;
            --accent-dark: #0369a1;
            --ink: #0f172a;
            --muted: #475569;
            --line: #dbeafe;
            --soft: #f0f9ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 18px;
            font-family: Inter, Arial, sans-serif;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(14, 165, 233, 0.12), rgba(255, 255, 255, 0) 42%),
                linear-gradient(315deg, rgba(16, 185, 129, 0.12), rgba(255, 255, 255, 0) 45%),
                #ffffff;
        }

        main {
            width: min(100%, 620px);
            padding: 44px 28px;
            text-align: center;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.1);
        }

        .logo {
            width: 170px;
            max-width: 70%;
            height: auto;
            margin-bottom: 26px;
        }

        .check {
            width: 72px;
            height: 72px;
            margin: 0 auto 22px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #047857;
            background: #dcfce7;
            font-size: 40px;
            font-weight: 800;
            line-height: 1;
        }

        h1 {
            margin: 0;
            font-size: clamp(32px, 6vw, 48px);
            line-height: 1.05;
            letter-spacing: 0;
        }

        p {
            max-width: 500px;
            margin: 18px auto 0;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.65;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }

        a {
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 800;
            text-decoration: none;
        }

        .primary {
            color: #ffffff;
            background: var(--accent);
        }

        .primary:hover {
            background: var(--accent-dark);
        }

        .secondary {
            color: var(--accent-dark);
            background: var(--soft);
            border: 1px solid var(--line);
        }
    </style>
</head>

<body>
    <main>
        <img class="logo" src="logo.png" alt="Global Coach IT Academy">
        <div class="check" aria-hidden="true">&#10003;</div>
        <h1>Thank You!</h1>
        <p>
            We received your request successfully. Our team will call you shortly with the next steps.
        </p>
        <div class="actions" aria-label="Next actions">
            <a class="primary" href="tel:+917337376600">Call Now</a>
            <a class="secondary" href="mm-landing-page.html">Back to Home</a>
        </div>
    </main>
</body>

</html>
