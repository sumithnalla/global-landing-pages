    <meta charset="UTF-8">

    <title>Thank You | Global Coach IT Academy Manikonda Branch</title>
    <meta name="description"
        content="Thank you for contacting Global Coach IT Academy Manikonda branch. Our counselor will call you shortly.">
    <link rel="icon" href="favicon.jpg">
    <style>
        :root {
            color-scheme: light;
            --accent: #0284c7;
            --accent-dark: #0369a1;
            --ink: #0f172a;
            --muted: #475569;
            --line: #dbeafe;
            --soft: #f0f9ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 18px;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(14, 165, 233, 0.12), rgba(255, 255, 255, 0) 42%),
                linear-gradient(315deg, rgba(16, 185, 129, 0.12), rgba(255, 255, 255, 0) 45%),
                #ffffff;
        }

        main {
            width: min(100%, 700px);
            padding: 44px 28px;
            text-align: center;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.1);
        }

        .logo {
            width: 180px;
            max-width: 70%;
            height: auto;
            margin-bottom: 26px;
        }

        .check {
            width: 76px;
            height: 76px;
            margin: 0 auto 22px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #047857;
            background: #dcfce7;
            font-size: 42px;
            font-weight: 800;
            line-height: 1;
            box-shadow: 0 8px 24px rgba(4, 120, 87, 0.2);
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 42px);
            line-height: 1.15;
            letter-spacing: -0.02em;
            color: #0f172a;
        }

        p {
            max-width: 540px;
            margin: 18px auto 0;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }

        a {
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .secondary {
            color: var(--accent-dark);
            background: var(--soft);
            border: 1px solid var(--line);
        }

        .secondary:hover {
            background: #e0f2fe;
        }

        .whatsapp {
            color: #ffffff;
            background: #16a34a;
            box-shadow: 0 6px 20px rgba(22, 163, 74, 0.3);
        }

        .whatsapp:hover {
            background: #15803d;
            transform: translateY(-1px);
        }

        .next-steps {
            margin-top: 34px;
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--soft);
        }

        .next-steps h2 {
            margin: 0 0 18px;
            font-size: 20px;
            line-height: 1.25;
            color: var(--ink);
        }

        .steps {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto 1fr;
            align-items: center;
            gap: 12px;
        }

        .step {
            min-height: 88px;
            display: grid;
            place-items: center;
            gap: 6px;
            padding: 14px 10px;
            border-radius: 10px;
            background: #ffffff;
            border: 1px solid rgba(2, 132, 199, 0.18);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.05);
        }

        .step-label {
            color: var(--accent-dark);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .step-text {
            color: var(--ink);
            font-size: 15px;
            font-weight: 700;
            line-height: 1.35;
        }

        .step-arrow {
            color: var(--accent);
            font-size: 24px;
            font-weight: 800;
        }

        @media (max-width: 640px) {
            main {
                padding: 32px 18px;
            }

            .steps {
                grid-template-columns: 1fr;
            }

            .step-arrow {
                transform: rotate(90deg);
            }
        }
    </style>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KNK2QR5Z" height="0" width="0"

    <main>
        <img class="logo" src="logo.png" alt="Global Coach IT Academy">
        <div class="check" aria-hidden="true">&#10003;</div>
        <h1>Thank You! Your Request is Confirmed &#10003;</h1>
        <p>
            Our Manikonda branch counselor will call you shortly on your WhatsApp number.
        </p>
        <div class="actions" aria-label="Next actions">
            <a class="whatsapp" href="https://wa.me/918790532776" target="_blank" rel="noopener">
                Chat With Manikonda Branch
            </a>
            <a class="secondary" href="sap-manikonda.html">Back to Branch Page</a>
        </div>
        <section class="next-steps" aria-labelledby="next-steps-title">
            <h2 id="next-steps-title">Next Steps</h2>
            <div class="steps">
                <div class="step">
                    <span class="step-label">Step 1</span>
                    <span class="step-text">We Call You</span>
                </div>
                <div class="step-arrow" aria-hidden="true">&rarr;</div>
                <div class="step">
                    <span class="step-label">Step 2</span>
                    <span class="step-text">Free Demo or Counseling</span>
                </div>
                <div class="step-arrow" aria-hidden="true">&rarr;</div>
                <div class="step">
                    <span class="step-label">Step 3</span>
                    <span class="step-text">Visit Manikonda Branch</span>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
